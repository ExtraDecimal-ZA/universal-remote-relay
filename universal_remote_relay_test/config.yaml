name: Universal Remote Relay (Experimental)
version: "0.4.2"
slug: universal_remote_relay_test
description: Persistent phone remote relay with private Apple TV pairing
url: https://github.com/ExtraDecimal-ZA/universal-remote-relay
image: ghcr.io/extradecimal-za/universal-remote-relay-test
startup: application
boot: manual
stage: experimental
init: false
host_network: true
ingress: true
ingress_port: 0
panel_title: Remote Relay
panel_admin: true
arch:
  - aarch64
options:
  log_level: info
  target_platform: apple_tv
  target_name: ""
  target_identifier: ""
  target_address: ""
schema:
  log_level: list(debug|info|warning|error)
  target_platform: list(apple_tv|android_tv)
  target_name: str
  target_identifier: str
  target_address: str

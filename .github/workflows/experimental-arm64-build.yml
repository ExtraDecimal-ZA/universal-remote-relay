name: Experimental ARM64 add-on build
on:
  push:
    branches: [main]
    paths:
      - 'universal_remote_relay_test/**'
      - '.github/workflows/experimental-arm64-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate experimental Python and tests
        run: |
          python3 -m py_compile universal_remote_relay_test/app/safe_scan.py
          python3 -m unittest discover -s universal_remote_relay_test/tests -p 'test_safe_scan.py' -v
          bash -n universal_remote_relay_test/run.sh
      - name: Build experimental ARM64 add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./universal_remote_relay_test
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/base-python:3.14-alpine3.24
            BUILD_ARCH=aarch64
            BUILD_VERSION=0.1.5

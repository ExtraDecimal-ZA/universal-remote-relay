name: Experimental ARM64 image
on:
  push:
    branches: [main]
    paths:
      - 'universal_remote_relay_test/**'
      - '.github/workflows/experimental-arm64-build.yml'
  pull_request:
    paths:
      - 'universal_remote_relay_test/**'
      - '.github/workflows/experimental-arm64-build.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: experimental-arm64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  arm64-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate experimental Python and tests
        run: |
          python3 -m pip install -r universal_remote_relay_test/requirements.txt ruff==0.17.4
          python3 -m compileall universal_remote_relay_test/app
          python3 -m unittest discover -s universal_remote_relay_test/tests -v
          python3 -m ruff check universal_remote_relay_test/app universal_remote_relay_test/tests
          python3 -m ruff format --check universal_remote_relay_test/app universal_remote_relay_test/tests
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("universal_remote_relay_test/app/selector.py").read_text(
              encoding="utf-8"
          )
          match = re.search(r"<script>\n(.*?)\n</script>", source, re.DOTALL)
          if match is None:
              raise SystemExit("selector script was not found")
          Path("/tmp/selector.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/selector.js
          node universal_remote_relay_test/tests/test_selector_ui.js
          bash -n universal_remote_relay_test/run.sh
      - name: Read image metadata
        id: image
        shell: bash
        run: |
          version="$(sed -n 's/^version: "\(.*\)"/\1/p' universal_remote_relay_test/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/universal-remote-relay-test" >> "$GITHUB_OUTPUT"

      - name: Require a new immutable version tag
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          image='${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}'
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $image"
            exit 1
          fi

      - name: Build experimental ARM64 image locally
        shell: bash
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            --build-arg BUILD_ARCH=aarch64 \
            --build-arg BUILD_VERSION='${{ steps.image.outputs.version }}' \
            --tag '${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}' \
            universal_remote_relay_test

      - name: Start finished ARM64 image and verify readiness
        shell: bash
        run: |
          set -euo pipefail
          container_id=""
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          container_id="$(docker run --detach --platform linux/arm64 \
            --env INGRESS_PORT=0 \
            '${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}')"
          ready=false
          for _ in $(seq 1 20); do
            logs="$(docker logs "$container_id" 2>&1)"
            if grep -q 'Private Home Assistant target selector is ready' <<< "$logs"; then
              ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]]; then
              echo "$logs"
              exit 1
            fi
            sleep 1
          done
          docker exec "$container_id" python3 -c '
          import socket

          remote = socket.socket()
          remote.settimeout(2)
          assert remote.connect_ex(("127.0.0.1", 6466)) == 0, "trusted reconnect port is closed"
          remote.close()

          pairing = socket.socket()
          pairing.settimeout(2)
          assert pairing.connect_ex(("127.0.0.1", 6467)) != 0, "new-pairing port is open by default"
          pairing.close()
          '
          docker logs "$container_id"
          [[ "$ready" == true ]]

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested experimental ARM64 image
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          docker push '${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}'

      - name: Verify anonymous ARM64 download
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          docker logout ghcr.io
          image='${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}'
          docker image rm "$image"
          docker pull --platform linux/arm64 "$image"
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
          echo "Downloaded platform: $platform"
          [[ "$platform" == 'linux/arm64' ]]

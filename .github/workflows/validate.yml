name: Validate add-on

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: universal_remote_relay/requirements.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r universal_remote_relay/requirements.txt PyYAML

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for filename in (
              "repository.yaml",
              "universal_remote_relay/config.yaml",
              "universal_remote_relay/build.yaml",
          ):
              with Path(filename).open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{filename} must contain a YAML mapping")
          PY

      - name: Run unit tests
        working-directory: universal_remote_relay
        run: python -m unittest discover -s tests -v

      - name: Compile service
        working-directory: universal_remote_relay
        run: python -m compileall app

      - name: Check launcher syntax
        run: bash -n universal_remote_relay/run.sh

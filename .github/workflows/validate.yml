name: Validate add-on

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            universal_remote_relay/requirements.txt
            universal_remote_relay_test/requirements.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r universal_remote_relay/requirements.txt -r universal_remote_relay_test/requirements.txt PyYAML

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for filename in (
              "repository.yaml",
              "universal_remote_relay/config.yaml",
              "universal_remote_relay/build.yaml",
              "universal_remote_relay_test/config.yaml",
              "universal_remote_relay_test/build.yaml",
          ):
              with Path(filename).open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{filename} must contain a YAML mapping")
          PY

      - name: Run unit tests
        run: |
          (cd universal_remote_relay && python -W error -m unittest discover -s tests -v)
          (cd universal_remote_relay_test && python -W error -m unittest discover -s tests -v)

      - name: Compile service
        run: |
          python -m compileall universal_remote_relay/app
          python -m compileall universal_remote_relay_test/app

      - name: Check launcher syntax
        run: |
          bash -n universal_remote_relay/run.sh
          bash -n universal_remote_relay_test/run.sh

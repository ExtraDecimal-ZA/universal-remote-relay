name: Validate add-on

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            universal_remote_relay/requirements.txt
            universal_remote_relay_test/requirements.txt

      - name: Install runtime and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r universal_remote_relay/requirements.txt -r universal_remote_relay_test/requirements.txt PyYAML ruff==0.17.4

      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for filename in (
              "repository.yaml",
              "universal_remote_relay/config.yaml",
              "universal_remote_relay_test/config.yaml",
              "universal_remote_relay_test/translations/en.yaml",
          ):
              with Path(filename).open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{filename} must contain a YAML mapping")

          experimental = yaml.safe_load(
              Path("universal_remote_relay_test/config.yaml").read_text(encoding="utf-8")
          )
          expected_image = "ghcr.io/extradecimal-za/universal-remote-relay-test"
          if experimental.get("image") != expected_image:
              raise SystemExit(f"experimental image must be {expected_image}")

          version = experimental.get("version")
          for filename in (
              "universal_remote_relay_test/Dockerfile",
              "universal_remote_relay_test/app/service.py",
              "universal_remote_relay_test/run.sh",
          ):
              if version not in Path(filename).read_text(encoding="utf-8"):
                  raise SystemExit(f"{filename} does not match version {version}")

          if experimental.get("ingress") is not True or experimental.get("ingress_port") != 0:
              raise SystemExit("experimental selector must use private dynamic ingress")
          if experimental.get("stage") != "experimental":
              raise SystemExit("experimental add-on must declare stage: experimental")
          if "ports" in experimental or "webui" in experimental:
              raise SystemExit("experimental selector must not publish a host port")
          if "enable_single_scan" in experimental.get("options", {}):
              raise SystemExit("startup scan option must remain removed")
          if "enable_single_scan" in experimental.get("schema", {}):
              raise SystemExit("startup scan schema must remain removed")
          for key in (
              "target_platform",
              "target_name",
              "target_identifier",
              "target_address",
          ):
              if key in experimental.get("options", {}):
                  raise SystemExit(f"retired target option must be removed: {key}")
              if key in experimental.get("schema", {}):
                  raise SystemExit(f"retired target schema must be removed: {key}")

          release_workflow = Path(
              ".github/workflows/experimental-arm64-build.yml"
          ).read_text(encoding="utf-8")
          if "docker manifest inspect" not in release_workflow:
              raise SystemExit("release workflow must reject existing version tags")

          launcher = Path("universal_remote_relay_test/run.sh").read_text(
              encoding="utf-8"
          )
          if "bashio::app.ingress_port" in launcher:
              raise SystemExit("launcher must not depend on unavailable Bashio helper")

          for filename in (
              "universal_remote_relay/build.yaml",
              "universal_remote_relay_test/build.yaml",
              "universal_remote_relay_test/app/safe_scan.py",
              "universal_remote_relay_test/tests/test_safe_scan.py",
          ):
              if Path(filename).exists():
                  raise SystemExit(f"obsolete file must be removed: {filename}")
          PY

      - name: Run unit tests
        run: |
          (cd universal_remote_relay && python -W error -m unittest discover -s tests -v)
          (cd universal_remote_relay_test && python -W error -m unittest discover -s tests -v)

      - name: Lint experimental service
        run: |
          python -m ruff check universal_remote_relay_test/app universal_remote_relay_test/tests
          python -m ruff format --check universal_remote_relay_test/app universal_remote_relay_test/tests

      - name: Compile service
        run: |
          python -m compileall universal_remote_relay/app
          python -m compileall universal_remote_relay_test/app

      - name: Check launcher syntax
        run: |
          bash -n universal_remote_relay/run.sh
          bash -n universal_remote_relay_test/run.sh

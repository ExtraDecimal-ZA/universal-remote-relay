name: ARM64 add-on build check
on:
  push:
    branches:
      - development/v0.1.4-apple-tv-discovery
  workflow_dispatch:
jobs:
  arm64-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Python syntax and tests
        run: |
          python3 -m py_compile universal_remote_relay/app/safe_scan.py
          python3 -m unittest discover -s universal_remote_relay/tests -p 'test_safe_scan.py' -v
      - name: Build ARM64 add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./universal_remote_relay
          platforms: linux/arm64
          push: false
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/base-python:3.14-alpine3.24
            BUILD_ARCH=aarch64
            BUILD_VERSION=0.1.4
